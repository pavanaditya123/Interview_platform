name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_STREAM_API_KEY: ci_placeholder
